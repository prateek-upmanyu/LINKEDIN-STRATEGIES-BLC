name: Daily B2B Strategy & Tips Automation

on:
  schedule:
    # 6:35 PM IST (1:05 PM UTC / 13:05 UTC) on Tuesday, Thursday, Saturday
    - cron: '5 13 * * 2,4,6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  publish-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy publisher
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python -u main.py

      - name: Commit and push updated strategy history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategy_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update strategy history [skip ci]" && git push)
